<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#027AEC" />
    <title>BizTrac - Offline</title>
    <style>
      :root {
        --color-palm: #027AEC;
        --color-ink: #022864;
        --color-bg: #F4F8FF;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-ink);
        padding: 20px;
      }
      .card {
        width: min(100%, 420px);
        padding: 32px 28px;
        border: 1px solid #DBEAFE;
        border-radius: 24px;
        background: #FFFFFF;
        box-shadow: 0 10px 25px -5px rgba(2, 122, 236, 0.1);
        text-align: center;
      }
      .icon-box {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: rgba(2, 122, 236, 0.1);
        color: var(--color-palm);
      }
      .icon-box svg {
        width: 32px;
        height: 32px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 900;
        color: var(--color-ink);
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
        font-weight: 500;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        background: #FEF3C7;
        color: #92400E;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
      }
      .btn {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 14px;
        background: var(--color-palm);
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .btn:hover {
        background: #015fbe;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a9 9 0 010-12.728M5.636 5.636L3 3m2.636 2.636l2.829 2.829m0 0a5 5 0 017.072 0" />
        </svg>
      </div>
      <span class="badge">Offline Mode</span>
      <h1>You are offline</h1>
      <p>Your saved business records and app shell are available. Reconnect to the internet to sync offline sales and access live services.</p>
      <button class="btn" onclick="window.location.reload()">Check Connection</button>
    </div>
  </body>
</html>
